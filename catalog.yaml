name: blog-reader
origin: own
lifecycle: active
form: ios

one_liner: 我的三个博客站合成一条时间线 —— 联网拉 feed，正文抓到就永久缓存，离线可读

stack: swift-ui
notes: |
  **数据口不是新建的**:三个站早就在发 `/feed.json`(公开、无闸,blog-site 的
  `app/feed.json/route.ts`,本来是给「blog 站聚合别站」用的)。app 只是又一个消费者。

  只新增了一处站侧接口:`blog-site/app/api/post/[slug]/route.ts` —— feed 只带 excerpt,
  离线读正文得能把 markdown 取下来。它是 `getBlogPostBySlug` 的薄壳,
  **私密/归属判定一律由那个 SSOT 决定**(与 `/api/tts/<slug>` 同一做法),
  这里不写第二套判据 —— 两份判据必然漂移,而漂移方向是私密文章从新接口漏出去。

  两段式缓存:索引每次开 app 刷(小,要能立刻看到新文章);正文取到就长期留着
  (发布后基本不改,且地铁里没信号也该能读)。缓存放 Application Support 不是 Caches ——
  Caches 会被 iOS 在空间紧张时自行清掉,那正好在最需要离线的时候把它拿走。

  **MarkdownView.swift 是从 ~/Apps/mac/ask-claude 逐字 vendored 的**,不是这里写的。
  `./check-markdown-drift.sh` 逐字节守着。为让两边共用同一份文件,上游那 5 处
  `Color(nsColor:)` 已收进 `#if os(macOS)` 色板常量(macOS 取值一个没变,ask-claude 观感零变化)。

  回归打的是解析层:`ref/fixtures/` = 三站真 feed 快照 + 一份契约容忍度夹具
  (缺可选字段 / 多一个 app 还不认识的字段 / 同日同 slug 中英镜像),两侧共读同一批夹具:
      node ref/expect.js  → expected.json  (按契约算期望)
      ./ref/regress       → actual.json    (跑真的 Sources/Feed.swift)
      node ref/diff.js    → 462 个值 + id 唯一性
  反向验证过两个真 bug:id 去掉 siteKey(三站撞 slug)→ 140 处红;
  合并排序丢掉「同日按标题」→ 228 处红。

  真机装机 `./install-to-iphone.sh`(免费 Personal Team,证书 7 天到期,重跑即续)。
  该脚本与 options-calc 那份**逐字节相同** —— 项目名/bundle id/显示名全从
  `project.yml` 读,所以 `cp -R` 出来的新 app 不用改它。

key_scripts:
  - build.sh                    # swiftc 直编 + 手搓 .app + actool 编图标(模拟器)
  - install-to-iphone.sh        # 真机:挑 Xcode(总部 SSOT) → 找设备 → 取 Team → 编签 → 装
  - ~/Dev/tools/dev/lib/tools/macapp/ios/detect_device.py            # 设备探测唯一实现(脚本与测试都调它)
  - ~/Dev/tools/dev/lib/tools/macapp/ios/test-device-detect.py       # 11 例双向验证
  - check-markdown-drift.sh     # MarkdownView 与上游 ask-claude 逐字节一致
  - make_icon.py                # 图标(三个来源汇成一条阅读流)
  - ref/expect.js, ref/main.swift, ref/diff.js   # 解析层回归三件套

depends_on:
  - Dev/tools/dev/lib/tools/macapp/xcode_env.sh   # 挑 Xcode 的总部 SSOT(禁写死路径)
  - Apps/mac/ask-claude/Sources/MarkdownView.swift # vendored 上游(漂移守卫看着)
  - Dev/stations/blog-site                         # 数据口 /feed.json + /api/post/<slug>
